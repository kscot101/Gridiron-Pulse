name: Refresh v2.1 production projections

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-v21-context-to-main.yml'
      - 'scripts/projection_identity.py'
      - 'scripts/refresh_projection_feed.py'
      - 'scripts/install_projection_safety.py'
      - 'scripts/test_projection_reliability.py'
      - 'scripts/test_projection_safety.js'
      - 'assets/projection-safety.js'

permissions:
  contents: write
  pages: write

concurrency:
  group: v21-production-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out production
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check out pinned existing model
        uses: actions/checkout@v4
        with:
          ref: a5fc82a259d68f72b34637faaafb3fb4f07a1586
          path: research
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model dependencies
        run: python -m pip install pandas numpy requests pyreadr feedparser
      - name: Restore completed-season inputs
        uses: actions/cache@v4
        with:
          path: .cache/projections-v21
          key: v21-reliability-source-2012-2025-v1
      - name: Test identity and missing-stat guardrails
        run: python scripts/test_projection_reliability.py
      - name: Install and validate page guardrails
        run: |
          python scripts/install_projection_safety.py
          python scripts/install_projection_safety.py
          node scripts/test_projection_safety.js
      - name: Generate fresh production forecasts
        run: python -u scripts/refresh_projection_feed.py --research research --season 2026 --cache .cache/projections-v21 --out data
      - name: Publish only validated fresh results
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html projections-2026.html data/player-context-v21.json data/projection-refresh-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh projections with source freshness and QB identity safeguards'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Request GitHub Pages build explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Retain refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projection-reliability-${{ github.run_id }}
          retention-days: 14
          path: data/projection-refresh-status.json
          if-no-files-found: ignore
