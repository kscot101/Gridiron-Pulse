name: Install Player Game Profiles

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-player-game-logs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate current player profile assets and source feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          feed=json.loads(Path('data/player-recent-games.json').read_text())
          assert feed['ok'] is True and len(feed['players']) > 500
          js=Path('assets/player-game-log.js').read_text()
          assert 'function h2hOpponent(' in js
          assert 'MATCHUP HISTORY / HEAD TO HEAD' in js
          print('Current player profile includes recent games and restored H2H.')
          PY
          node --check assets/player-game-log.js
      - name: Connect current profiles without restoring archived assets
        run: python scripts/install-player-game-logs.py
      - name: Publish player stats interface
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/install-player-game-logs.py index.html projections-2026.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Keep current player profiles and head-to-head integration'
          git pull --rebase origin main
          git push origin main
