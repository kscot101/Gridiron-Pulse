name: V1.9 Historical Player Comparables Lab

on:
  workflow_dispatch:
    inputs:
      data_start_season:
        description: "First historical season to audit"
        required: true
        default: "2012"
      data_end_season:
        description: "Last historical season to audit"
        required: true
        default: "2025"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v19-player-comparables-lab.yml"

permissions:
  contents: read

jobs:
  player-data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATA_START_SEASON: ${{ github.event_name == 'workflow_dispatch' && inputs.data_start_season || '2012' }}
      DATA_END_SEASON: ${{ github.event_name == 'workflow_dispatch' && inputs.data_end_season || '2025' }}

    steps:
      - name: Checkout v1.9 model lab branch
        uses: actions/checkout@v4
        with:
          ref: model-lab-v19-player-comparables

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify v1.9 lab files
        run: |
          test -f model-lab/v19_player_data_audit.py
          test -f model-lab/v19_player_anomaly_engine.py
          test -f data/gridiron-history-data.json

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests pyreadr

      - name: Run historical player data audit
        run: |
          python model-lab/v19_player_data_audit.py \
            --start "$DATA_START_SEASON" \
            --end "$DATA_END_SEASON" \
            --out model-lab/output/v19-player-audit

      - name: Smoke-test anomaly guardrail
        run: |
          python model-lab/v19_player_anomaly_engine.py

      - name: Show audit summary
        if: always()
        run: |
          if [ -f model-lab/output/v19-player-audit/audit_summary.json ]; then
            cat model-lab/output/v19-player-audit/audit_summary.json
          fi

      - name: Show checkpoint sample
        if: always()
        run: |
          if [ -f model-lab/output/v19-player-audit/checkpoint_summary.csv ]; then
            cat model-lab/output/v19-player-audit/checkpoint_summary.csv
          fi

      - name: Show source failures
        if: always()
        run: |
          if [ -f model-lab/output/v19-player-audit/failures.csv ]; then
            cat model-lab/output/v19-player-audit/failures.csv
          fi

      - name: Upload v1.9 audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v19-player-data-audit-${{ env.DATA_START_SEASON }}-${{ env.DATA_END_SEASON }}
          path: |
            model-lab/output/v19-player-audit/audit_summary.json
            model-lab/output/v19-player-audit/source_coverage.csv
            model-lab/output/v19-player-audit/identifier_match_rates.csv
            model-lab/output/v19-player-audit/player_checkpoint_candidates.csv
            model-lab/output/v19-player-audit/checkpoint_summary.csv
            model-lab/output/v19-player-audit/failures.csv
          if-no-files-found: warn
          retention-days: 14
