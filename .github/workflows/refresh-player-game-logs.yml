name: Refresh Player Game Logs
on:
  push:
    branches: [main]
    paths:
      - scripts/build-player-game-logs.py
      - scripts/build_player_directory.py
      - scripts/player_log_shards.py
      - scripts/test_player_directory.py
      - .github/workflows/refresh-player-game-logs.yml
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: player-recent-games
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build verified records, roster identities and small log files
        run: |
          python scripts/build-player-game-logs.py
          python scripts/build_player_directory.py
          python scripts/player_log_shards.py
          python scripts/test_player_directory.py
      - name: Publish only verified player lookup data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/player-recent-games.json data/player-directory.json data/player-logs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh player directory identities and published recent games'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Request public site rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds --silent
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: player-directory-refresh-diagnostics
          retention-days: 7
          path: data/player-directory.json
