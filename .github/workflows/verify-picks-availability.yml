name: Verify durable picks preview
on:
  push:
    branches: [picks-availability-20261028]
    paths: ['scripts/**', 'assets/**', '.github/workflows/verify-picks-availability.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: durable-picks-preview
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: picks-availability-20261028
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify saved source and forecast protections
        run: |
          pip install pandas numpy requests
          python scripts/install_durable_picks.py
          python scripts/polish_saved_picks.py
          python scripts/test_durable_picks.py
          python scripts/test_projection_trial.py
          node --check assets/saved-picks.js
      - name: Exercise filters and actual saved cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/check_durable_picks.js');s=p.read_text()
          anchor="      assert.ok(await page.locator('#gp-saved-picks [data-saved-record]').count()>0);"
          checks='''
                if(!useFixture){
                  await page.locator('[data-edge="qb"]').click();
                  await page.waitForFunction(()=>{const cards=[...document.querySelectorAll('#gp-saved-picks [data-saved-record]')];return cards.length>0&&cards.every(c=>c.querySelector('small').textContent.includes('/ QB'));});
                  await page.locator('[data-edge="favorites"]').click();
                  await page.waitForFunction(()=>document.getElementById('gp-saved-picks').textContent.includes('No saved picks match this filter'));
                  await page.locator('[data-edge="all"]').click();
                  await page.waitForFunction(()=>document.querySelectorAll('#gp-saved-picks [data-saved-record]').length>0);
                  report.positionFilter=true;report.favoriteEmptyState=true;
                }
          '''
          if 'report.favoriteEmptyState=true' not in s:
              assert s.count(anchor)==1
              p.write_text(s.replace(anchor,anchor+'\n'+checks))
          PY
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/check_durable_picks.js
          node scripts/check_projection_trial.js
          python -c "import json; r=json.load(open('durable-picks-verification.json')); assert r['passed'] and r['upcomingPlayerMatchups']>0"
      - name: Save verified repair on preview branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/saved-picks.js scripts/check_durable_picks.js scripts/projection_trial.py scripts/refresh_homepage_feed.py durable-picks-verification.json data/projection-trial-verification.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Verify saved pick filters and first-visitor resilience'
          git push origin HEAD:picks-availability-20261028
      - name: Bundle inspected source and screenshots
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('picks-work.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in Path('.').rglob('*'):
                  if not p.is_file() or any(v in p.parts for v in ['.git','node_modules','.cache','__pycache__']): continue
                  if p.suffix in ['.html','.css','.js','.py','.json','.yml','.md','.png']: z.write(p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: durable-picks-work
          path: picks-work.zip
          retention-days: 7
