name: Add Spotlight Game to Homepage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-spotlight-game.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  spotlight-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install dynamic spotlight game
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/add_spotlight_game.py
          python /tmp/add_spotlight_game.py
          python -c "from pathlib import Path; p=Path('index.html').read_text(encoding='utf-8'); s=p.rsplit('<script>',1)[1].split('</script>',1)[0]; Path('/tmp/gridiron-index.js').write_text(s,encoding='utf-8')"
          node --check /tmp/gridiron-index.js
          grep -q 'id="spotlight-game"' index.html
          grep -q 'function renderSpotlight()' index.html
          grep -q 'Signals caught' index.html

      - name: Commit spotlight homepage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage changes to commit."
            exit 0
          fi
          git commit -m "Add dynamic spotlight game to homepage"
          git push origin main
