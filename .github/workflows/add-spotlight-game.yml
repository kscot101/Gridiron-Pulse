name: Update Spotlight Game

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-spotlight-game.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  spotlight-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Simplify spotlight signals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          page = path.read_text(encoding="utf-8")
          old = '''        '<div class="spotlight-signal-head"><strong>Why this game surfaced</strong><span>' +
        escapeHtml(picks.length) +
        (picks.length === 1 ? " player path" : " player paths") +
        "</span></div>" +'''
          new = '''        '<div class="spotlight-signal-head"><strong>Game signals</strong></div>' +'''

          if old in page:
              page = page.replace(old, new, 1)
          elif 'spotlight-signal-head"><strong>Game signals</strong>' not in page:
              raise RuntimeError("Spotlight signal header was not found")

          path.write_text(page, encoding="utf-8")
          PY

      - name: Commit homepage update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage changes to commit."
            exit 0
          fi
          git commit -m "Simplify spotlight game signals"
          git push origin main
