name: Update Spotlight Game

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-spotlight-game.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  spotlight-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove spotlight explanation text
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); s=s.replace('<strong>Why this game surfaced</strong><span>', '<strong>Game signals</strong><span style=\"display:none\">', 1); p.write_text(s)"

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove spotlight explanation text"
          git push origin main
