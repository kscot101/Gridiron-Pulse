name: Inspect homepage feed freshness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/site-feed-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect homepage source and live feeds
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from pathlib import Path
          page = Path('index.html').read_text()
          for name in ['loadSnapshot', 'renderAll', 'renderHeader', 'spotlightGame', 'allBoards']:
              match = re.search(r'(?:async )?function '+name+r'\([^)]*\)\s*\{', page)
              if match:
                  end = re.search(r'\n    (?:async )?function ', page[match.end():])
                  text = page[match.start():match.end()+end.start()] if end else page[match.start():match.start()+3500]
                  print('SOURCE '+name+'\n'+text[:9500], flush=True)
          urls = dict(re.findall(r'var\s+(\w+_URL)\s*=\s*[\"\']([^\"\']+)', page))
          print('URLS', json.dumps(urls), flush=True)
          endpoints=[]
          for variable, base in urls.items():
              if variable!='AGENT_URL': continue
              suffixes=re.findall(variable+r'\s*\+\s*[\"\']([^\"\']+)', page)
              for suffix in suffixes:
                  if any(x in suffix for x in ['snapshot','latest']): endpoints.append(base+suffix)
          endpoints.append('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard')
          report={}
          for url in sorted(set(endpoints)):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'GridironPulse-FeedAudit/1','Accept':'application/json','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=30) as response:
                      data=json.load(response)
                  report[url]=data
                  obj=data.get('snapshot') or data.get('data') or data
                  print('FEED',url,'KEYS',list(data),'META',json.dumps({k:v for k,v in obj.items() if not isinstance(v,(list,dict))})[:6000],flush=True)
                  for key in ['season','week','meta','source','summary','warnings']:
                      if key in obj: print(key,json.dumps(obj[key])[:2400],flush=True)
                  for key in ['games','events','results','playerEdge']:
                      rows=obj.get(key,[])
                      if not isinstance(rows,list): continue
                      print('COUNT',key,len(rows),flush=True)
                      for row in rows[:18]:
                          brief={k:row.get(k) for k in ['id','gameId','date','generatedAt','week','seasonWeek','name','shortName','matchup','player','team','status','outcome','actual','lockedAt'] if k in row}
                          if key=='playerEdge': brief['picks']=len(row.get('picks',[]))
                          print(key,json.dumps(brief)[:1200],flush=True)
              except Exception as exc:
                  print('FETCH ERROR',url,str(exc),flush=True)
          Path('site-feed-audit.json').write_text(json.dumps(report,indent=2))
          print('FILES',json.dumps([str(p) for p in Path('.').glob('**/*') if p.is_file() and '.git/' not in str(p) and any(t in str(p).lower() for t in ['worker','snapshot','result','agent','wrangler'])])[:14000],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-feed-audit
          retention-days: 7
          path: |
            site-feed-audit.json
            index.html
