name: Emphasize Player H2H

on:
  push:
    branches: [main]
    paths:
      - "scripts/emphasize-player-h2h.py"
      - ".github/workflows/emphasize-player-h2h.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emphasize-h2h:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make H2H prominent
        run: python scripts/emphasize-player-h2h.py

      - name: Validate JavaScript
        run: node --check assets/player-game-logs.js

      - name: Commit H2H emphasis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/player-game-logs.js
          if git diff --cached --quiet; then
            echo "No H2H changes to commit."
            exit 0
          fi
          git commit -m "Make offensive head-to-head prominent"
          git push origin main
