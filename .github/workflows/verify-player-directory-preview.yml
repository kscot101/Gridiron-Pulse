name: Verify player directory preview
on:
  push:
    branches: [player-directory-labels-20261105]
    paths: ['scripts/**', 'assets/**', '.github/workflows/verify-player-directory-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: player-directory-preview
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: player-directory-labels-20261105
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download published roster and weekly sources
        run: |
          mkdir -p .directory-inputs
          curl -fLsS --retry 2 --max-time 90 https://github.com/nflverse/nflverse-data/releases/download/rosters/roster_2026.csv -o .directory-inputs/roster.csv
          curl -fLsS --retry 2 --max-time 90 https://github.com/nflverse/nfldata/raw/refs/heads/master/data/games.csv -o .directory-inputs/games.csv
          curl -fLsS --retry 2 --max-time 90 https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2026.csv -o .directory-inputs/players.csv
      - name: Apply and verify repair
        run: |
          sha256sum data/projection-trial.json data/projection-trial-ledger.json > /tmp/protected-shas
          python scripts/install_player_directory_repair.py
          python scripts/build_player_directory.py --input-dir .directory-inputs
          python scripts/player_log_shards.py --install
          python scripts/test_player_directory.py
          node --check assets/player-directory.js
          node --check assets/player-log-shards.js
          node --check assets/player-game-log.js
          node --check assets/saved-picks.js
          node --check assets/projection-trial.js
          pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/check_player_directory.py
          sha256sum -c /tmp/protected-shas
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html pick-tracker.html projection-trial.html projections-2026.html team.html assets data/player-directory.json data/player-recent-games.json data/player-logs scripts/install-player-game-logs.py scripts/install_durable_picks.py scripts/install_projection_trial.py scripts/check_player_directory.py player-directory-verification.json
          if ! git diff --cached --quiet; then
            git commit -m 'Verify searchable players and small game-log downloads'
            git push origin HEAD:player-directory-labels-20261105
          fi
      - name: Bundle inspected source and verification
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile, subprocess
          files=[Path(p) for p in subprocess.check_output(['git','ls-files'],text=True).splitlines()]
          files+=list(Path('.directory-inputs').glob('*'))
          files+=list(Path('.').glob('player-directory-*.png'))
          files+=list(Path('data/player-logs').glob('*.json'))
          files += [Path('player-directory-verification.json'),Path('data/player-directory.json')]
          with zipfile.ZipFile('player-directory-work.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in dict.fromkeys(files):
                  if p.is_file():z.write(p,str(p))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-directory-work
          path: player-directory-work.zip
          retention-days: 7
