name: V1.9 Historical Player Data Audit

on:
  workflow_dispatch:
    inputs:
      start_season:
        description: "First historical season to audit"
        required: true
        default: "2012"
      end_season:
        description: "Last historical season to audit"
        required: true
        default: "2025"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v19-player-data-audit.yml"

permissions:
  contents: read

jobs:
  player-data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      START_SEASON: ${{ github.event_name == 'workflow_dispatch' && inputs.start_season || '2012' }}
      END_SEASON: ${{ github.event_name == 'workflow_dispatch' && inputs.end_season || '2025' }}

    steps:
      - name: Checkout player lab branch
        uses: actions/checkout@v4
        with:
          ref: model-lab-v19-player-comparables

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify audit file
        run: |
          test -f model-lab/v19_player_data_audit.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests pyreadr

      - name: Run historical player data audit
        run: |
          python model-lab/v19_player_data_audit.py \
            --start "$START_SEASON" \
            --end "$END_SEASON" \
            --out model-lab/output/v19-player-audit

      - name: Show audit summary
        if: always()
        run: |
          if [ -f model-lab/output/v19-player-audit/audit_summary.json ]; then
            cat model-lab/output/v19-player-audit/audit_summary.json
          fi

      - name: Show checkpoint summary
        if: always()
        run: |
          if [ -f model-lab/output/v19-player-audit/checkpoint_summary.csv ]; then
            cat model-lab/output/v19-player-audit/checkpoint_summary.csv
          fi

      - name: Upload player audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v19-player-data-audit-${{ env.START_SEASON }}-${{ env.END_SEASON }}
          path: |
            model-lab/output/v19-player-audit/source_coverage.csv
            model-lab/output/v19-player-audit/identifier_match_rates.csv
            model-lab/output/v19-player-audit/player_checkpoint_candidates.csv
            model-lab/output/v19-player-audit/checkpoint_summary.csv
            model-lab/output/v19-player-audit/failures.csv
            model-lab/output/v19-player-audit/audit_summary.json
          if-no-files-found: warn
          retention-days: 14
