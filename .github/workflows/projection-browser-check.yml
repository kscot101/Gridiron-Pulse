name: Verify deployed projection reliability
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/projection-browser-check.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test live homepage and projections page
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1365,height:900}});
            const page=await context.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(e.message));
            const base='https://kscot101.github.io/Gridiron-Pulse/';
            await page.goto(base+'?verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>window.GPProjectionSafety && window.state && state.playerContext && state.playerContext.reliabilityVersion===1,{},{timeout:60000});
            await page.waitForFunction(()=>typeof allGames==='function' && allGames().length>0,{},{timeout:60000});
            const home=await page.evaluate(()=>{
              const picks=allBoards().flatMap(b=>b.picks||[]);
              return {generatedAt:state.playerContext.generatedAt,sourceGeneratedAt:state.playerContext.sourceGeneratedAt,
                missing:finiteProjection(null),blank:finiteProjection(' '),zero:finiteProjection(0),
                fresh:GPProjectionSafety.fresh(state.playerContext),games:allGames().length,picks:picks.length,
                matchingProjections:picks.filter(p=>findProjectionForPick(p)).length,
                timestampVisible:!!document.getElementById('projection-feed-status')};
            });
            assert.equal(home.missing,null);assert.equal(home.blank,null);assert.equal(home.zero,0);
            assert.equal(home.fresh,true);assert.equal(home.timestampVisible,true);
            await page.screenshot({path:'projection-home-check.png',fullPage:false});
            const stale=await page.evaluate(()=>{
              const saved=state.playerContext.generatedAt;
              state.playerContext.generatedAt='2026-09-04T00:00:00Z';
              const blocked=allBoards().flatMap(b=>b.picks||[]).every(p=>findProjectionForPick(p)===null);
              state.playerContext.generatedAt=saved;
              return blocked;
            });
            assert.equal(stale,true);
            await page.goto(base+'projections-2026.html?verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.locator('[data-proj-follow]').first().waitFor({timeout:60000});
            const btn=page.locator('[data-proj-follow]').first();
            const key=await btn.getAttribute('data-proj-follow');
            await btn.click();
            await page.waitForFunction(k=>Array.from(document.querySelectorAll('[data-proj-follow]')).find(b=>b.dataset.projFollow===k)?.getAttribute('aria-pressed')==='true',key);
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(k=>Array.from(document.querySelectorAll('[data-proj-follow]')).find(b=>b.dataset.projFollow===k)?.getAttribute('aria-pressed')==='true',key,{timeout:60000});
            const cards=await page.locator('#grid .card').count();
            await page.setViewportSize({width:390,height:844});
            await page.screenshot({path:'projection-mobile-check.png',fullPage:false});
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+2);
            const matching=page.locator('[data-proj-follow]').filter({hasText:'Following'}).first();
            await matching.click();
            assert.ok(cards>0);assert.equal(overflow,false);assert.deepEqual(errors,[]);
            const report={home,staleProjectionBlocked:stale,projectionCards:cards,followPersistsAfterReload:true,mobileHasNoHorizontalOverflow:!overflow,pageErrors:errors};
            fs.writeFileSync('projection-browser-check.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Retain verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projection-browser-verification
          retention-days: 14
          path: |
            projection-browser-check.json
            projection-home-check.png
            projection-mobile-check.png
