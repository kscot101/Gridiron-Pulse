name: Refresh team defensive profiles
on:
  workflow_dispatch:
  schedule:
    - cron: '20 10,18 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-defense-profiles.yml'
      - 'scripts/build_defense_profiles.py'
      - 'scripts/test_defense_profiles.py'
      - 'scripts/check_defense_comparisons.js'
      - 'assets/matchup-comparisons.js'
      - 'assets/matchup-comparisons.css'
      - 'team.html'
permissions:
  contents: write
  pages: write
concurrency:
  group: team-defense-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download current regular-season source statistics
        run: |
          set -euo pipefail
          SEASON=$(python -c "from datetime import datetime,timezone;d=datetime.now(timezone.utc);print(d.year-(d.month<3))")
          echo "DEFENSE_SEASON=$SEASON" >> "$GITHUB_ENV"
          mkdir -p .defense-inputs
          curl -fLsS --retry 2 --max-time 90 "https://github.com/nflverse/nflverse-data/releases/download/stats_team/stats_team_week_${SEASON}.csv" -o .defense-inputs/teams.csv
          curl -fLsS --retry 2 --max-time 90 "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_${SEASON}.csv" -o .defense-inputs/players.csv
          curl -fLsS --retry 2 --max-time 90 https://raw.githubusercontent.com/nflverse/nfldata/master/data/games.csv -o .defense-inputs/games.csv
      - name: Verify and build descriptive comparisons
        run: |
          node --check assets/matchup-comparisons.js
          python scripts/test_defense_profiles.py
          python scripts/build_defense_profiles.py --season "$DEFENSE_SEASON"
      - name: Verify cards, profiles and mobile layout
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/check_defense_comparisons.js
      - name: Publish only defensive comparison data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/team-defense.json data/defense-players.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh team defensive comparisons from completed games'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Request public site rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds --silent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-defense-verification
          retention-days: 7
          path: |
            defense-verification.json
            defense-*.png
