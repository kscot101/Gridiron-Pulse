name: V2.0 Player Identity Scheduled Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 2,4"

permissions:
  contents: write

concurrency:
  group: v20-player-identity-scheduled-refresh
  cancel-in-progress: false

jobs:
  refresh-player-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      START_SEASON: "2012"
      END_SEASON: "2025"
      TEST_START_SEASON: "2015"
      FORECAST_SEASON: "2026"
      OUTPUT_DIR: model-lab/output/v20-player-identity
      INTEGRATION_DIR: model-lab/output/v20-player-identity-integration
      CACHE_DIR: model-lab/output/v20-player-identity-cache
      RESULT_DIR: model-lab/results/v20-player-identity-latest

    steps:
      - name: Checkout Player Identity research branch
        uses: actions/checkout@v4
        with:
          ref: model-lab-v20-player-identity-baseline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests pyreadr

      - name: Restore nflverse source cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CACHE_DIR }}
          key: v20-player-identity-nflverse-${{ env.START_SEASON }}-${{ env.END_SEASON }}-${{ env.FORECAST_SEASON }}-v2

      - name: Rebuild Player Identity baseline
        run: |
          python model-lab/v20_player_identity_baseline.py \
            --start "$START_SEASON" \
            --end "$END_SEASON" \
            --test-start "$TEST_START_SEASON" \
            --forecast-season "$FORECAST_SEASON" \
            --out "$OUTPUT_DIR" \
            --cache "$CACHE_DIR" \
            --contract-context model-lab/v20_contract_context.json

      - name: Refresh verified-role 2026 preview
        run: |
          python model-lab/v20_player_identity_integration_replay.py \
            --source "$OUTPUT_DIR/player_season_identity_source.csv" \
            --backtest "$OUTPUT_DIR/backtest_predictions.csv" \
            --forecast "$OUTPUT_DIR/forecast_${FORECAST_SEASON}_player_identity.csv" \
            --start "$TEST_START_SEASON" \
            --end "$END_SEASON" \
            --out "$INTEGRATION_DIR" \
            --cache "$CACHE_DIR"

      - name: Publish refreshed shadow data
        run: |
          mkdir -p "$RESULT_DIR"
          cp "$OUTPUT_DIR/overall_model_summary.csv" "$RESULT_DIR/"
          cp "$OUTPUT_DIR/position_model_summary.csv" "$RESULT_DIR/"
          cp "$OUTPUT_DIR/career_state_model_summary.csv" "$RESULT_DIR/"
          cp "$OUTPUT_DIR/star_and_shortened_summary.csv" "$RESULT_DIR/"
          cp "$OUTPUT_DIR/sanity_checks.csv" "$RESULT_DIR/"
          cp "$OUTPUT_DIR/forecast_${FORECAST_SEASON}_player_identity.csv" "$RESULT_DIR/"
          cp "$OUTPUT_DIR/run_summary.json" "$RESULT_DIR/"
          cp "$OUTPUT_DIR/baseline_policy.json" "$RESULT_DIR/"
          cp "$INTEGRATION_DIR/integration_overall_summary.csv" "$RESULT_DIR/"
          cp "$INTEGRATION_DIR/integration_position_summary.csv" "$RESULT_DIR/"
          cp "$INTEGRATION_DIR/integration_subset_summary.csv" "$RESULT_DIR/"
          cp "$INTEGRATION_DIR/integration_role_coverage.csv" "$RESULT_DIR/"
          cp "$INTEGRATION_DIR/integration_source_coverage.csv" "$RESULT_DIR/"
          cp "$INTEGRATION_DIR/integration_2026_preview.csv" "$RESULT_DIR/"
          cp "$INTEGRATION_DIR/integration_2026_preview.json" "$RESULT_DIR/"
          cp "$INTEGRATION_DIR/integration_2026_sanity_checks.csv" "$RESULT_DIR/"
          cp "$INTEGRATION_DIR/integration_summary.json" "$RESULT_DIR/"
          cp "$INTEGRATION_DIR/integration_policy.json" "$RESULT_DIR/"
          printf '{\n  "sourceCommit": "%s",\n  "workflowRun": "%s",\n  "startSeason": "%s",\n  "endSeason": "%s",\n  "testStartSeason": "%s",\n  "forecastSeason": "%s"\n}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$START_SEASON" "$END_SEASON" "$TEST_START_SEASON" "$FORECAST_SEASON" > "$RESULT_DIR/run_manifest.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$RESULT_DIR"
          if git diff --cached --quiet; then
            echo "Player Identity shadow data is already current."
          else
            git commit -m "Refresh v2.0 Player Identity shadow data [skip ci]"
            git push origin HEAD:model-lab-v20-player-identity-baseline
          fi
