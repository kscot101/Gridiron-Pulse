name: Verify public Power Pulse
on:
  push:
    branches: [main]
    paths:
      - 'assets/power-pulse.js'
      - 'assets/power-pulse.css'
      - 'index.html'
      - '.github/workflows/verify-power-pulse-public.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: power-pulse-public-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser verifier
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check published Power Pulse without live feeds
        run: |
          python - <<'PY'
          import json,time
          from datetime import datetime,timezone
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          base='https://kscot101.github.io/Gridiron-Pulse/'
          last=None
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              for attempt in range(8):
                  context=browser.new_context(viewport={'width':390,'height':844},timezone_id='America/New_York')
                  errors=[];responses=[]
                  def route(r):
                      if not r.request.url.startswith(base) or '/data/homepage-snapshot.json' in r.request.url:return r.abort()
                      r.continue_()
                  context.route('**/*',route)
                  page=context.new_page();page.on('pageerror',lambda e:errors.append(str(e)))
                  page.on('response',lambda r:responses.append({'url':r.url,'status':r.status}) if 'power-pulse' in r.url else None)
                  try:
                      page.goto(base+'?power-check='+str(time.time()),wait_until='domcontentloaded',timeout=30000)
                      page.wait_for_function("window.GPPowerPulse && document.querySelectorAll('#power-grid .ranking-card').length===16",timeout=12000)
                      details=page.evaluate("({power:powerRankings(),state:document.getElementById('power-feed-status').textContent,savedScheduleGames:allGames().length,feedStatus:window.state?.snapshot?.feedStatus||null})")
                      # The same-origin saved schedule may work while every external API is blocked.
                      # Verify live analysis is absent rather than demanding an empty scoreboard.
                      assert not (details.get('feedStatus') or {}).get('analysisCurrent'),'Live analysis unexpectedly available in outage test'
                      p=details['power'];assert len(p['teams'])==32 and len(p['players'])>0,'Saved rankings missing'
                      expected=[str(round(r['heatScore'])) for r in sorted(p['teams'],key=lambda r:r['heatScore'],reverse=True)[:16]]
                      assert page.locator('#power-grid .ranking-card .heat > strong').all_text_contents()==expected,'Displayed scores differ from saved rankings'
                      page.locator('[data-power-kind="players"]').click()
                      page.locator('[data-power-position="QB"]').click()
                      assert page.locator('#power-grid .ranking-card').count()>0,'QB rankings missing'
                      page.locator('[data-power-order="cold"]').click()
                      page.locator('[data-power-order="hot"]').click()
                      page.locator('[data-power-kind="teams"]').click()
                      page.locator('#power-pulse').scroll_into_view_if_needed()
                      assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+2'),'Mobile horizontal overflow'
                      assert not errors,errors
                      page.screenshot(path='power-pulse-public-mobile.png')
                      report={'testedAt':datetime.now(timezone.utc).isoformat(),'publicSite':True,'externalFeedsBlocked':True,'bigSnapshotBlocked':True,'liveAnalysisUnavailable':True,'savedScheduleGames':details['savedScheduleGames'],'teamCount':len(p['teams']),'playerCount':len(p['players']),'rankingGeneratedAt':p['generatedAt'],'statusText':details['state'],'exactScores':True,'teamPlayerFilters':True,'mobileOverflow':False,'pageErrors':errors,'passed':True}
                      Path('power-pulse-public.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2));last=None;context.close();break
                  except Exception as e:
                      last=e
                      diagnostic={'attempt':attempt+1,'error':str(e),'pageErrors':errors,'responses':responses}
                      try:
                          diagnostic['page']=page.evaluate("({url:location.href,module:!!window.GPPowerPulse,render:typeof window.renderPower,cards:document.querySelectorAll('#power-grid .ranking-card').length,status:document.getElementById('power-feed-status')?.textContent,feedStatus:window.state?.snapshot?.feedStatus||null,scripts:[...document.scripts].map(s=>s.src).filter(s=>s.includes('power')),title:document.title})")
                          page.screenshot(path='power-pulse-public-mobile.png')
                      except Exception:pass
                      Path('power-pulse-public-diagnostic.json').write_text(json.dumps(diagnostic,indent=2));print(json.dumps(diagnostic,indent=2),flush=True)
                      context.close()
                      if attempt<7:time.sleep(12)
              browser.close()
          if last:raise last
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-power-pulse-verification
          retention-days: 7
          path: |
            power-pulse-public.json
            power-pulse-public-diagnostic.json
            power-pulse-public-mobile.png
