name: Install and verify homepage feed safety
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-homepage-feed-safety.yml'
      - 'assets/homepage-feed.js'
      - 'assets/homepage-score-source.js'
      - 'scripts/install_homepage_feed.py'
      - 'scripts/test_homepage_feed.js'
      - 'scripts/check_homepage_browser.js'
permissions:
  contents: write
  pages: write
concurrency:
  group: homepage-safety-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and install homepage guards
        run: |
          node --check assets/homepage-feed.js
          node --check assets/homepage-score-source.js
          node scripts/test_homepage_feed.js
          python scripts/refresh_homepage_scores.py
          python scripts/install_homepage_feed.py
      - name: Install browser test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify current games, history and existing controls
        run: node scripts/check_homepage_browser.js
      - name: Publish verified homepage
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/homepage-safety-verification.json data/homepage-scoreboard.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Show current game data and keep old model results explicitly historical'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds --silent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-current-browser-verification
          retention-days: 14
          path: |
            data/homepage-safety-verification.json
            homepage-current-desktop.png
            homepage-current-results.png
            homepage-current-mobile.png
            homepage-current-error.png
            homepage-browser-error.json
