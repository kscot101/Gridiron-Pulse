name: Simplify Spotlight Signals

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/simplify-spotlight-signals.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove spotlight explanation header
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          page = path.read_text(encoding="utf-8")

          old = '''        '<div class="spotlight-signal-head"><strong>Why this game surfaced</strong><span>' +
        escapeHtml(picks.length) +
        (picks.length === 1 ? " player path" : " player paths") +
        "</span></div>" +
        '<div class="spotlight-signals">' +'''

          new = '''        '<div class="spotlight-signal-head"><strong>Game signals</strong></div>' +
        '<div class="spotlight-signals">' +'''

          if old not in page:
              if 'spotlight-signal-head"><strong>Game signals</strong>' in page:
                  print("Spotlight header is already simplified.")
                  raise SystemExit(0)
              raise RuntimeError("Could not find the current spotlight explanation header")

          page = page.replace(old, new, 1)
          path.write_text(page, encoding="utf-8")
          print("Removed Why this game surfaced and player-path count from spotlight.")
          PY

      - name: Commit homepage update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage changes to commit."
            exit 0
          fi
          git commit -m "Simplify spotlight game signals"
          git push origin main
