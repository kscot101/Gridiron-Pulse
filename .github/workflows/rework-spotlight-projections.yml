name: Rework Spotlight Layout and Projections

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rework-spotlight-projections.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rework hero and add picked-player projections
        run: python .github/scripts/rework_spotlight.py

      - name: Commit homepage rework
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Rework spotlight layout and show player projections"
          git push origin main
