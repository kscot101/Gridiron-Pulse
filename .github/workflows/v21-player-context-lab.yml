name: V2.1 Last-Season Player Context Lab

on:
  workflow_dispatch:
    inputs:
      start_season:
        description: "First rolling held-out season"
        required: true
        default: "2015"
      end_season:
        description: "Last completed season"
        required: true
        default: "2025"
      forecast_season:
        description: "Season to preview"
        required: true
        default: "2026"
  schedule:
    - cron: "20 12 * * 2,4"
  push:
    branches:
      - model-lab-v21-player-context-baseline
    paths:
      - ".github/workflows/v21-player-context-lab.yml"
      - "model-lab/v21_player_context_baseline.py"
      - "model-lab/v21_player_context_runner.py"
      - "model-lab/v21_touchdown_projection.py"
      - "model-lab/v21_news_pulse.py"
      - "model-lab/v21_context_config.json"
      - "model-lab/v21_player_context_plan.md"

permissions:
  contents: write

concurrency:
  group: v21-player-context-${{ github.ref }}
  cancel-in-progress: false

jobs:
  player-context-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      START_SEASON: ${{ github.event_name == 'workflow_dispatch' && inputs.start_season || '2015' }}
      END_SEASON: ${{ github.event_name == 'workflow_dispatch' && inputs.end_season || '2025' }}
      FORECAST_SEASON: ${{ github.event_name == 'workflow_dispatch' && inputs.forecast_season || '2026' }}
      CACHE_DIR: model-lab/output/v21-player-context-cache
      V20_DIR: model-lab/output/v21-v20-source
      V21_DIR: model-lab/output/v21-player-context
      RESULT_DIR: model-lab/results/v21-player-context-latest

    steps:
      - name: Checkout v2.1 research branch
        uses: actions/checkout@v4
        with:
          ref: model-lab-v21-player-context-baseline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify v2.1 research files
        run: |
          test -f model-lab/v21_player_context_baseline.py
          test -f model-lab/v21_player_context_runner.py
          test -f model-lab/v21_touchdown_projection.py
          test -f model-lab/v21_news_pulse.py
          test -f model-lab/v21_context_config.json
          test -f model-lab/v21_player_context_plan.md
          python -m py_compile \
            model-lab/v20_player_identity_core.py \
            model-lab/v20_player_identity_model.py \
            model-lab/v20_player_identity_baseline.py \
            model-lab/v20_player_identity_integration_replay.py \
            model-lab/v21_player_context_baseline.py \
            model-lab/v21_player_context_runner.py \
            model-lab/v21_touchdown_projection.py \
            model-lab/v21_news_pulse.py
          python -m json.tool model-lab/v21_context_config.json >/dev/null

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests pyreadr feedparser

      - name: Restore nflverse source cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CACHE_DIR }}
          key: v21-player-context-${{ env.START_SEASON }}-${{ env.END_SEASON }}-${{ env.FORECAST_SEASON }}-v1

      - name: Build reusable player-season source
        run: |
          python model-lab/v20_player_identity_baseline.py \
            --start 2012 \
            --end "$END_SEASON" \
            --test-start "$START_SEASON" \
            --forecast-season "$FORECAST_SEASON" \
            --out "$V20_DIR" \
            --cache "$CACHE_DIR" \
            --contract-context model-lab/v20_contract_context.json

      - name: Run last-season context replay and 2026 preview
        run: |
          python model-lab/v21_player_context_runner.py \
            --source "$V20_DIR/player_season_identity_source.csv" \
            --backtest "$V20_DIR/backtest_predictions.csv" \
            --forecast "$V20_DIR/forecast_${FORECAST_SEASON}_player_identity.csv" \
            --config model-lab/v21_context_config.json \
            --history data/gridiron-history-data.json \
            --start "$START_SEASON" \
            --end "$END_SEASON" \
            --forecast-season "$FORECAST_SEASON" \
            --cache "$CACHE_DIR" \
            --out "$V21_DIR"

      - name: Add projected touchdowns using the v2.1 factors
        run: |
          python model-lab/v21_touchdown_projection.py \
            --preview "$V21_DIR/preview_${FORECAST_SEASON}.json" \
            --source "$V20_DIR/player_season_identity_source.csv" \
            --season "$FORECAST_SEASON" \
            --worker-url "https://gridiron-pulse-season.kadescott97.workers.dev/season-outlook"

      - name: Collect attributed player news context
        run: |
          python model-lab/v21_news_pulse.py \
            --preview "$V21_DIR/preview_${FORECAST_SEASON}.json" \
            --config model-lab/v21_context_config.json \
            --out "$V21_DIR/preview_${FORECAST_SEASON}_news.json"

      - name: Show historical comparison
        if: always()
        run: |
          if [ -f "$V21_DIR/overall_summary.csv" ]; then
            cat "$V21_DIR/overall_summary.csv"
          fi
          if [ -f "$V21_DIR/position_summary.csv" ]; then
            cat "$V21_DIR/position_summary.csv"
          fi

      - name: Show context subsets
        if: always()
        run: |
          if [ -f "$V21_DIR/subset_summary.csv" ]; then
            cat "$V21_DIR/subset_summary.csv"
          fi

      - name: Show policy and preview status
        if: always()
        run: |
          if [ -f "$V21_DIR/policy.json" ]; then
            cat "$V21_DIR/policy.json"
          fi
          if [ -f "$V21_DIR/run_summary.json" ]; then
            cat "$V21_DIR/run_summary.json"
          fi
          if [ -f "$V21_DIR/preview_${FORECAST_SEASON}_news.json" ]; then
            python - <<'PY'
          import json, os
          path = f"model-lab/output/v21-player-context/preview_{os.environ['FORECAST_SEASON']}_news.json"
          data = json.load(open(path, encoding="utf-8"))
          print(json.dumps({
              "ready": data.get("ready"),
              "careerStateUsed": data.get("careerStateUsed"),
              "newsArticleCount": data.get("newsArticleCount"),
              "newsPlayersWithEvidence": data.get("newsPlayersWithEvidence"),
              "newsPlayersActionable": data.get("newsPlayersActionable"),
              "newsApplyToProjection": data.get("newsApplyToProjection"),
              "touchdownProjectionPlayers": (data.get("meta") or {}).get("touchdownProjectionPlayers"),
              "productionChanged": data.get("productionChanged"),
          }, indent=2))
          PY
          fi

      - name: Publish latest v2.1 shadow summaries
        if: success()
        run: |
          mkdir -p "$RESULT_DIR"
          cp "$V21_DIR/overall_summary.csv" "$RESULT_DIR/"
          cp "$V21_DIR/position_summary.csv" "$RESULT_DIR/"
          cp "$V21_DIR/subset_summary.csv" "$RESULT_DIR/"
          cp "$V21_DIR/policy.json" "$RESULT_DIR/"
          cp "$V21_DIR/run_summary.json" "$RESULT_DIR/"
          cp "$V21_DIR/preview_${FORECAST_SEASON}.csv" "$RESULT_DIR/"
          cp "$V21_DIR/preview_${FORECAST_SEASON}.json" "$RESULT_DIR/"
          cp "$V21_DIR/preview_${FORECAST_SEASON}_news.json" "$RESULT_DIR/"
          printf '{\n  "sourceCommit": "%s",\n  "workflowRun": "%s",\n  "startSeason": "%s",\n  "endSeason": "%s",\n  "forecastSeason": "%s"\n}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$START_SEASON" "$END_SEASON" "$FORECAST_SEASON" \
            > "$RESULT_DIR/run_manifest.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$RESULT_DIR"
          if git diff --cached --quiet; then
            echo "v2.1 player context outputs are already current."
          else
            git commit -m "Update latest v2.1 player context results [skip ci]"
            git push origin HEAD:model-lab-v21-player-context-baseline
          fi

      - name: Upload v2.1 research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v21-player-context-${{ env.START_SEASON }}-${{ env.END_SEASON }}
          retention-days: 14
          path: |
            model-lab/output/v21-player-context/historical_replay.csv
            model-lab/output/v21-player-context/overall_summary.csv
            model-lab/output/v21-player-context/position_summary.csv
            model-lab/output/v21-player-context/subset_summary.csv
            model-lab/output/v21-player-context/policy.json
            model-lab/output/v21-player-context/run_summary.json
            model-lab/output/v21-player-context/preview_${{ env.FORECAST_SEASON }}.csv
            model-lab/output/v21-player-context/preview_${{ env.FORECAST_SEASON }}.json
            model-lab/output/v21-player-context/preview_${{ env.FORECAST_SEASON }}_news.json
