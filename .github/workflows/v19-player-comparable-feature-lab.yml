name: V1.9 Player Comparable Feature Lab

on:
  workflow_dispatch:
    inputs:
      start_season:
        description: "First historical season"
        required: true
        default: "2012"
      end_season:
        description: "Last historical season"
        required: true
        default: "2025"
      test_start_season:
        description: "First held-out backtest season"
        required: true
        default: "2014"
  push:
    branches:
      - model-lab-v19-player-comparables
    paths:
      - ".github/workflows/v19-player-comparable-feature-lab.yml"
      - "model-lab/v19_player_feature_builder.py"
      - "model-lab/v19_player_comparable_backtest.py"
      - "model-lab/v19_player_isolated_environment_backtest.py"
      - "model-lab/v19_player_validated_combination_backtest.py"
      - "model-lab/v19_player_history_blend_backtest.py"
      - "model-lab/v19_player_hybrid_backtest.py"
      - "model-lab/v19_player_position_summary.py"
      - "model-lab/v19_player_anomaly_engine.py"
      - "model-lab/v19_player_data_audit.py"
      - "model-lab/v19_player_environment_plan.md"

permissions:
  contents: write

jobs:
  player-comparable-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      START_SEASON: ${{ github.event_name == 'workflow_dispatch' && inputs.start_season || '2012' }}
      END_SEASON: ${{ github.event_name == 'workflow_dispatch' && inputs.end_season || '2025' }}
      TEST_START_SEASON: ${{ github.event_name == 'workflow_dispatch' && inputs.test_start_season || '2014' }}

    steps:
      - name: Checkout v1.9 research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify v1.9 research files
        run: |
          test -f model-lab/v19_player_data_audit.py
          test -f model-lab/v19_player_feature_builder.py
          test -f model-lab/v19_player_comparable_backtest.py
          test -f model-lab/v19_player_isolated_environment_backtest.py
          test -f model-lab/v19_player_validated_combination_backtest.py
          test -f model-lab/v19_player_history_blend_backtest.py
          test -f model-lab/v19_player_hybrid_backtest.py
          test -f model-lab/v19_player_position_summary.py
          test -f model-lab/v19_player_anomaly_engine.py
          test -f data/gridiron-history-data.json
          python -m py_compile model-lab/v19_player_feature_builder.py
          python -m py_compile model-lab/v19_player_comparable_backtest.py
          python -m py_compile model-lab/v19_player_isolated_environment_backtest.py
          python -m py_compile model-lab/v19_player_validated_combination_backtest.py
          python -m py_compile model-lab/v19_player_history_blend_backtest.py
          python -m py_compile model-lab/v19_player_hybrid_backtest.py
          python -m py_compile model-lab/v19_player_position_summary.py
          python -m py_compile model-lab/v19_player_anomaly_engine.py

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests pyreadr

      - name: Build point-in-time player features
        run: |
          python model-lab/v19_player_feature_builder.py \
            --start "$START_SEASON" \
            --end "$END_SEASON" \
            --out model-lab/output/v19-player-features \
            --history data/gridiron-history-data.json

      - name: Run rolling comparable backtest
        run: |
          python model-lab/v19_player_comparable_backtest.py \
            --features model-lab/output/v19-player-features/player_features.csv \
            --out model-lab/output/v19-player-backtest \
            --test-start "$TEST_START_SEASON"

      - name: Build position-specific research gates
        run: |
          python model-lab/v19_player_position_summary.py \
            --predictions model-lab/output/v19-player-backtest/backtest_predictions.csv \
            --season-metrics model-lab/output/v19-player-backtest/season_metrics.csv \
            --out model-lab/output/v19-player-backtest

      - name: Run v1.9b isolated environment tests
        run: |
          python model-lab/v19_player_isolated_environment_backtest.py \
            --features model-lab/output/v19-player-features/player_features.csv \
            --out model-lab/output/v19-player-isolated \
            --test-start "$TEST_START_SEASON"

      - name: Run v1.9c nested validated combination
        run: |
          python model-lab/v19_player_validated_combination_backtest.py \
            --features model-lab/output/v19-player-features/player_features.csv \
            --out model-lab/output/v19-player-validated \
            --test-start "$TEST_START_SEASON"

      - name: Run v1.9d nested history shrinkage
        run: |
          python model-lab/v19_player_history_blend_backtest.py \
            --features model-lab/output/v19-player-features/player_features.csv \
            --out model-lab/output/v19-player-history-blend \
            --test-start "$TEST_START_SEASON"

      - name: Run v1.9e nested shrinkage environment hybrid
        run: |
          python model-lab/v19_player_hybrid_backtest.py \
            --features model-lab/output/v19-player-features/player_features.csv \
            --out model-lab/output/v19-player-hybrid \
            --test-start "$TEST_START_SEASON"

      - name: Smoke-test secondary anomaly guardrail
        run: |
          python model-lab/v19_player_anomaly_engine.py

      - name: Show feature quality
        if: always()
        run: |
          if [ -f model-lab/output/v19-player-features/feature_quality.csv ]; then
            cat model-lab/output/v19-player-features/feature_quality.csv
          fi

      - name: Show v1.9d history policy
        if: always()
        run: |
          if [ -f model-lab/output/v19-player-history-blend/history_blend_policy.csv ]; then
            cat model-lab/output/v19-player-history-blend/history_blend_policy.csv
          fi

      - name: Show v1.9e position checkpoint summary
        if: always()
        run: |
          if [ -f model-lab/output/v19-player-hybrid/hybrid_position_checkpoint_summary.csv ]; then
            cat model-lab/output/v19-player-hybrid/hybrid_position_checkpoint_summary.csv
          fi

      - name: Show v1.9e hybrid policy
        if: always()
        run: |
          if [ -f model-lab/output/v19-player-hybrid/hybrid_policy.csv ]; then
            cat model-lab/output/v19-player-hybrid/hybrid_policy.csv
          fi

      - name: Show v1.9e environment frequency
        if: always()
        run: |
          if [ -f model-lab/output/v19-player-hybrid/hybrid_signal_frequency.csv ]; then
            cat model-lab/output/v19-player-hybrid/hybrid_signal_frequency.csv
          fi

      - name: Publish latest v1.9 research summaries
        if: success() && github.ref == 'refs/heads/model-lab-v19-player-comparables'
        run: |
          mkdir -p model-lab/results/v19-latest
          cp model-lab/output/v19-player-features/feature_quality.csv model-lab/results/v19-latest/
          cp model-lab/output/v19-player-isolated/isolated_promotion_candidates.csv model-lab/results/v19-latest/
          cp model-lab/output/v19-player-isolated/production_history_decay.csv model-lab/results/v19-latest/
          cp model-lab/output/v19-player-validated/validated_backtest_summary.json model-lab/results/v19-latest/
          cp model-lab/output/v19-player-validated/validated_overall_summary.csv model-lab/results/v19-latest/
          cp model-lab/output/v19-player-validated/validated_position_summary.csv model-lab/results/v19-latest/
          cp model-lab/output/v19-player-validated/validated_position_checkpoint_summary.csv model-lab/results/v19-latest/
          cp model-lab/output/v19-player-validated/validated_signal_selection_frequency.csv model-lab/results/v19-latest/
          cp model-lab/output/v19-player-validated/validated_history_policy.csv model-lab/results/v19-latest/
          cp model-lab/output/v19-player-validated/validated_selection_history.csv model-lab/results/v19-latest/
          cp model-lab/output/v19-player-validated/validated_selection_trace.csv model-lab/results/v19-latest/
          cp model-lab/output/v19-player-history-blend/history_blend_summary.json model-lab/results/v19-latest/
          cp model-lab/output/v19-player-history-blend/history_blend_overall_summary.csv model-lab/results/v19-latest/
          cp model-lab/output/v19-player-history-blend/history_blend_position_summary.csv model-lab/results/v19-latest/
          cp model-lab/output/v19-player-history-blend/history_blend_position_checkpoint_summary.csv model-lab/results/v19-latest/
          cp model-lab/output/v19-player-history-blend/history_blend_policy.csv model-lab/results/v19-latest/
          cp model-lab/output/v19-player-history-blend/history_blend_selection_history.csv model-lab/results/v19-latest/
          cp model-lab/output/v19-player-hybrid/hybrid_summary.json model-lab/results/v19-latest/
          cp model-lab/output/v19-player-hybrid/hybrid_overall_summary.csv model-lab/results/v19-latest/
          cp model-lab/output/v19-player-hybrid/hybrid_position_summary.csv model-lab/results/v19-latest/
          cp model-lab/output/v19-player-hybrid/hybrid_position_checkpoint_summary.csv model-lab/results/v19-latest/
          cp model-lab/output/v19-player-hybrid/hybrid_policy.csv model-lab/results/v19-latest/
          cp model-lab/output/v19-player-hybrid/hybrid_signal_frequency.csv model-lab/results/v19-latest/
          cp model-lab/output/v19-player-hybrid/hybrid_selection_history.csv model-lab/results/v19-latest/
          printf '{\n  "sourceCommit": "%s",\n  "workflowRun": "%s",\n  "startSeason": "%s",\n  "endSeason": "%s",\n  "testStartSeason": "%s"\n}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$START_SEASON" "$END_SEASON" "$TEST_START_SEASON" > model-lab/results/v19-latest/run_manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- model-lab/results/v19-latest
          if git diff --cached --quiet; then
            echo "No research summary changes to publish."
          else
            git commit -m "Update latest v1.9 research summaries [skip ci]"
            git push origin HEAD:model-lab-v19-player-comparables
          fi

      - name: Upload v1.9 comparable lab outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v19-player-comparable-lab-${{ env.START_SEASON }}-${{ env.END_SEASON }}
          path: |
            model-lab/output/v19-player-features/player_features.csv
            model-lab/output/v19-player-features/feature_quality.csv
            model-lab/output/v19-player-features/feature_manifest.json
            model-lab/output/v19-player-backtest/backtest_summary.json
            model-lab/output/v19-player-backtest/stage_summary.csv
            model-lab/output/v19-player-backtest/season_metrics.csv
            model-lab/output/v19-player-backtest/promotion_candidates.csv
            model-lab/output/v19-player-backtest/position_stage_summary.csv
            model-lab/output/v19-player-backtest/position_checkpoint_summary.csv
            model-lab/output/v19-player-backtest/position_promotion_candidates.csv
            model-lab/output/v19-player-backtest/sample_comparables.csv
            model-lab/output/v19-player-isolated/isolated_backtest_summary.json
            model-lab/output/v19-player-isolated/isolated_season_metrics.csv
            model-lab/output/v19-player-isolated/isolated_stage_summary.csv
            model-lab/output/v19-player-isolated/isolated_position_summary.csv
            model-lab/output/v19-player-isolated/isolated_position_checkpoint_summary.csv
            model-lab/output/v19-player-isolated/isolated_promotion_candidates.csv
            model-lab/output/v19-player-isolated/production_history_decay.csv
            model-lab/output/v19-player-validated/validated_backtest_summary.json
            model-lab/output/v19-player-validated/validated_predictions.csv
            model-lab/output/v19-player-validated/validated_season_metrics.csv
            model-lab/output/v19-player-validated/validated_selection_history.csv
            model-lab/output/v19-player-validated/validated_selection_trace.csv
            model-lab/output/v19-player-validated/validated_overall_summary.csv
            model-lab/output/v19-player-validated/validated_position_summary.csv
            model-lab/output/v19-player-validated/validated_position_checkpoint_summary.csv
            model-lab/output/v19-player-validated/validated_signal_selection_frequency.csv
            model-lab/output/v19-player-validated/validated_history_policy.csv
            model-lab/output/v19-player-history-blend/history_blend_summary.json
            model-lab/output/v19-player-history-blend/history_blend_predictions.csv
            model-lab/output/v19-player-history-blend/history_blend_selection_history.csv
            model-lab/output/v19-player-history-blend/history_blend_selection_trace.csv
            model-lab/output/v19-player-history-blend/history_blend_overall_summary.csv
            model-lab/output/v19-player-history-blend/history_blend_position_summary.csv
            model-lab/output/v19-player-history-blend/history_blend_position_checkpoint_summary.csv
            model-lab/output/v19-player-history-blend/history_blend_policy.csv
            model-lab/output/v19-player-hybrid/hybrid_summary.json
            model-lab/output/v19-player-hybrid/hybrid_predictions.csv
            model-lab/output/v19-player-hybrid/hybrid_selection_history.csv
            model-lab/output/v19-player-hybrid/hybrid_selection_trace.csv
            model-lab/output/v19-player-hybrid/hybrid_overall_summary.csv
            model-lab/output/v19-player-hybrid/hybrid_position_summary.csv
            model-lab/output/v19-player-hybrid/hybrid_position_checkpoint_summary.csv
            model-lab/output/v19-player-hybrid/hybrid_signal_frequency.csv
            model-lab/output/v19-player-hybrid/hybrid_policy.csv
          if-no-files-found: warn
          retention-days: 14
