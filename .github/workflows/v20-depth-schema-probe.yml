name: V2.0 Depth Schema Probe

on:
  push:
    branches:
      - model-lab-v20-player-identity-baseline
    paths:
      - ".github/workflows/v20-depth-schema-probe.yml"
      - "model-lab/v20_depth_probe.py"
      - "model-lab/v20_player_identity_integration_replay.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas numpy requests pyreadr
      - uses: actions/cache@v4
        with:
          path: model-lab/output/v20-player-identity-cache
          key: v20-player-identity-nflverse-2012-2025-2026-v2
      - name: Probe depth schemas
        run: python model-lab/v20_depth_probe.py
